<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Troubleshooting — Crédito do Trabalhador</title>
<style>
  :root{
    --bg:#F5F6F8; --paper:#FFFFFF; --ink:#171B24; --ink-soft:#616B7A; --line:#E3E6EB;
    --accent:#5B5BD6; --accent-bg:#EDECFC; --accent-hover:#4A4AC4;
    --resolve-bg:#E9F5EE; --resolve-line:#227A4D; --resolve-ink:#155A36;
    --escalate-bg:#FDF0E7; --escalate-line:#B54708; --escalate-ink:#8A3A08;
    --info-bg:#EAEEFC; --info-line:#3454D1; --info-ink:#22399C;
    --note-bg:#FBF3D9; --note-line:#B08900; --note-ink:#6B5300;
    --option-bg:#F9FAFB; --hover-bg:#F0F1F5; --dashed-border:#C7CED6;
    --danger-ink:#C0490F;
    --sidebar-bg:#171B24; --sidebar-ink:#C7CCD6; --sidebar-ink-soft:#7C8492; --sidebar-active:#262C38; --sidebar-line:#262C38;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101319; --paper:#1A1E27; --ink:#E9ECF1; --ink-soft:#95A0AF; --line:#2B313D;
      --accent:#8484F0; --accent-bg:#242245; --accent-hover:#9C9CF5;
      --resolve-bg:#173321; --resolve-line:#3CB371; --resolve-ink:#B9F3CC;
      --escalate-bg:#3A2415; --escalate-line:#E08A4D; --escalate-ink:#FFDDC0;
      --info-bg:#16233A; --info-line:#5B9BE0; --info-ink:#D3E6FB;
      --note-bg:#332B0F; --note-line:#D9B23C; --note-ink:#F0D989;
      --option-bg:#20242E; --hover-bg:#242833; --dashed-border:#3A4250;
      --danger-ink:#E08A4D;
      --sidebar-bg:#0C0E13; --sidebar-ink:#B9C0CC; --sidebar-ink-soft:#657081; --sidebar-active:#1D2129; --sidebar-line:#1D2129;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    transition:background-color .2s ease, color .2s ease;
  }
  .layout{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{ width:260px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-ink); display:flex; flex-direction:column; }
  .sidebar-top{ padding:20px 16px 14px; }
  .sidebar-top h1{ font-size:14.5px; color:#fff; margin:0 0 2px; }
  .sidebar-top .sub{ font-size:11px; color:var(--sidebar-ink-soft); margin:0; }
  .sidebar-search{ padding:0 16px 12px; }
  .sidebar-search input{
    width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--sidebar-line);
    background:#1F2530; color:#fff; font-size:13px; font-family:inherit;
  }
  .sidebar-search input::placeholder{ color:var(--sidebar-ink-soft); }
  .nav-list{ flex:1; overflow-y:auto; padding:2px 10px; }
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; margin-bottom:2px; position:relative;
  }
  .nav-item:hover{ background:#1F2530; }
  .nav-item.active{ background:var(--sidebar-active); color:#fff; font-weight:600; }
  .nav-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .nav-item .label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .edit-icons{ display:none; gap:3px; flex-shrink:0; }
  .nav-item:hover .edit-icons{ display:flex; }
  .nav-icon-btn{
    width:20px; height:20px; border-radius:5px; border:none; background:rgba(255,255,255,.08); color:#fff;
    font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .nav-icon-btn:hover{ background:rgba(255,255,255,.18); }
  .nav-add{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--sidebar-ink-soft); border:1px dashed #2E3542; margin-top:6px;
  }
  .nav-add:hover{ background:#1F2530; color:#fff; }
  .no-cat-results{ color:var(--sidebar-ink-soft); font-size:12.5px; padding:10px; display:none; }

  .sidebar-footer{ border-top:1px solid var(--sidebar-line); padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .footer-item{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer;
    font-size:12.5px; color:var(--sidebar-ink-soft);
  }
  .footer-item:hover{ background:#1F2530; color:#fff; }
  .footer-item .count-badge{
    margin-left:auto; background:rgba(255,255,255,.1); color:#fff; font-size:10.5px; padding:1px 6px; border-radius:999px;
  }
  .footer-item.edit-active{ color:var(--accent); }

  /* ---------- Main panel ---------- */
  .main{ flex:1; padding:32px 40px 60px; max-width:820px; }
  .main-header{ margin-bottom:24px; }
  .main-header h2{ font-size:20px; margin:0 0 4px; letter-spacing:-0.01em; }
  .main-header .sub-main{ color:var(--ink-soft); font-size:13.5px; margin:0; }
  .back-link{
    display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:16px; font-family:inherit;
  }
  .back-link:hover{ color:var(--ink); }

  .header-actions{ display:flex; gap:8px; margin-top:12px; }
  .header-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:7px 12px;
    border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .header-btn:hover{ background:var(--hover-bg); }
  .header-btn.danger{ color:var(--danger-ink); border-color:var(--danger-ink); }

  /* ---------- Perguntas com revelação progressiva ---------- */
  .question-block{ margin-bottom:14px; }
  .q-text{ font-size:15px; font-weight:600; line-height:1.4; margin:0 0 12px; }
  .choice-buttons{ display:flex; flex-direction:column; gap:8px; }
  .option-btn{
    text-align:left; border:1px solid var(--line); background:var(--paper); padding:12px 14px;
    border-radius:9px; font-size:13.5px; font-family:inherit; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  }
  .option-btn:hover{ background:var(--hover-bg); border-color:var(--accent); }
  .option-btn.selected{ border-color:var(--accent); background:var(--accent-bg); font-weight:600; }
  .option-btn .arrow{ color:var(--ink-soft); flex-shrink:0; }
  .choice-answer:empty{ display:none; }
  .choice-answer{
    margin-top:12px; padding-left:16px; border-left:2px solid var(--accent-bg);
  }

  .steps-block{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .steps-block h4{ margin:0 0 8px; font-size:14px; }

  .leaf{ border-radius:10px; padding:14px 16px; border:1px solid; margin-bottom:10px; }
  .leaf.resolve{ background:var(--resolve-bg); border-color:var(--resolve-line); color:var(--resolve-ink); }
  .leaf.escalate{ background:var(--escalate-bg); border-color:var(--escalate-line); color:var(--escalate-ink); }
  .leaf.info{ background:var(--info-bg); border-color:var(--info-line); color:var(--info-ink); }
  .leaf .tone-tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.8; display:block; margin-bottom:7px; }
  .leaf h4{ margin:0 0 9px; font-size:14.5px; }

  .steps-list{ list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .steps-list li{ display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; }
  .steps-list .badge{
    flex-shrink:0; width:19px; height:19px; border-radius:5px; background:rgba(0,0,0,.06); color:inherit;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; opacity:.7;
  }
  .steps-block .steps-list .badge{ background:var(--option-bg); opacity:1; color:var(--ink-soft); }
  .where{
    font-size:12px; opacity:.8; background:rgba(0,0,0,.05); border-radius:6px; padding:2px 7px;
    display:inline-flex; gap:5px; align-items:center; margin-top:3px;
  }
  .steps-block .where{ background:var(--option-bg); color:var(--ink-soft); }

  .assumption{
    display:flex; gap:7px; background:var(--note-bg); border:1px solid var(--note-line); color:var(--note-ink);
    border-radius:8px; padding:8px 10px; font-size:12px; margin:8px 0; line-height:1.4;
  }
  .client-msg{
    background:rgba(255,255,255,.5); border:1px dashed rgba(0,0,0,.15); border-radius:8px; padding:10px 12px; margin-top:8px;
  }
  .client-msg .label{ font-size:11px; font-weight:700; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; gap:8px; opacity:.85; }
  .client-msg p{ margin:0; font-size:12.5px; line-height:1.5; white-space:pre-wrap; }

  .escalate-checklist-btn{
    display:inline-block; margin-top:8px; border:1px solid currentColor; background:transparent; color:inherit;
    font-size:12px; padding:6px 10px; border-radius:7px; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .escalate-checklist-btn:hover{ background:rgba(255,255,255,.3); }

  /* ---------- Evidence / image upload ---------- */
  .evidence{ margin-top:10px; }
  .evidence summary{
    cursor:pointer; font-size:12px; font-weight:600; opacity:.8; list-style:none;
    display:inline-flex; align-items:center; gap:5px;
  }
  .evidence summary::-webkit-details-marker{ display:none; }
  .evidence-body{ margin-top:8px; }
  .evidence-dropzone{
    border:1.5px dashed var(--dashed-border); border-radius:9px; padding:16px; text-align:center;
    font-size:12.5px; color:var(--ink-soft); background:var(--option-bg); cursor:pointer;
  }
  .evidence-dropzone:hover{ background:var(--hover-bg); }
  .evidence-dropzone input[type=file]{ display:none; }
  .evidence-thumb-wrap{ display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .evidence-thumb{
    max-width:220px; max-height:150px; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; display:block;
  }
  .evidence-thumb-actions{ display:flex; flex-direction:column; gap:6px; }
  .evidence-small-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:11.5px; padding:5px 9px;
    border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .evidence-small-btn:hover{ background:var(--hover-bg); }
  .evidence-small-btn.danger{ color:var(--danger-ink); border-color:var(--danger-ink); }
  .evidence-loading{ font-size:12px; color:var(--ink-soft); }

  .lightbox{
    position:fixed; inset:0; background:rgba(10,12,16,.85); display:none; align-items:center; justify-content:center;
    z-index:100; padding:30px; cursor:zoom-out;
  }
  .lightbox.active{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.4); }

  /* ---------- Panels: prazos / checklist ---------- */
  .prazos-table{ width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .prazos-table th, .prazos-table td{ text-align:left; padding:11px 14px; font-size:13.5px; border-bottom:1px solid var(--line); }
  .prazos-table th{ background:var(--option-bg); font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); }
  .prazos-table tr:last-child td{ border-bottom:none; }
  .prazos-table td.categoria{ color:var(--ink-soft); font-size:12px; white-space:nowrap; }

  .checklist-box{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .checklist-box ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .checklist-box li{ display:flex; gap:10px; align-items:flex-start; font-size:14px; }
  .checklist-box input[type=checkbox]{ width:18px; height:18px; margin-top:1px; accent-color:var(--accent); }

  .empty-state{ color:var(--ink-soft); font-size:13.5px; padding:14px 4px; }

  .continue-btn, .restart-btn{
    border:none; padding:10px 15px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .continue-btn{ background:var(--accent); color:#fff; }
  .continue-btn:hover{ background:var(--accent-hover); }
  .restart-btn{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .restart-btn:hover{ background:var(--hover-bg); }
  .footer-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  /* ---------- Editor forms ---------- */
  .editor-hint{ font-size:12px; color:var(--ink-soft); background:var(--option-bg); border-radius:7px; padding:9px 11px; margin-bottom:12px; line-height:1.45; }
  .form-group{ margin-bottom:14px; }
  .form-group label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .form-group input[type=text], .form-group select, .form-group textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; background:var(--paper); color:var(--ink);
  }
  .form-group input[type=color]{ width:60px; height:36px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
  .form-group textarea{ min-height:70px; resize:vertical; }
  .form-check{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:14px; }
  .form-check input{ width:17px; height:17px; accent-color:var(--accent); }

  .form-row-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .form-row-item{ display:flex; gap:8px; align-items:flex-start; background:var(--option-bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .form-row-item .fields{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .form-row-item input, .form-row-item select{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px;
    background:var(--paper); color:var(--ink); font-family:inherit;
  }
  .row-remove-btn{ background:none; border:none; color:var(--danger-ink); cursor:pointer; font-size:17px; padding:2px 4px; line-height:1; }
  .add-row-btn{
    align-self:flex-start; background:none; border:1px dashed var(--dashed-border); color:var(--ink-soft);
    padding:7px 12px; border-radius:7px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .add-row-btn:hover{ background:var(--hover-bg); }

  .node-list-item{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; }
  .node-list-item .info{ flex:1; min-width:0; }
  .node-list-item .type-tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); }
  .node-list-item .preview{ font-size:13.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node-list-item .root-tag{ font-size:10.5px; background:var(--info-bg); color:var(--info-line); padding:2px 7px; border-radius:999px; margin-left:6px; }
  .node-list-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--paper);
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .icon-btn:hover{ background:var(--hover-bg); }
  .icon-btn.danger{ color:var(--danger-ink); }

  @media (max-width:760px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; }
    .nav-list{ max-height:240px; }
    .main{ padding:24px 18px 50px; max-width:100%; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <h1>Troubleshooting CT</h1>
      <p class="sub">Crédito do Trabalhador</p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="Buscar categoria…" oninput="filterNav(this.value)">
    </div>
    <div class="nav-list" id="navList"></div>
    <p class="no-cat-results" id="noCatResults">Nenhuma categoria encontrada.</p>
    <div class="sidebar-footer">
      <div class="footer-item" onclick="openPrazos()"><span>⏱️</span><span>Tabela de prazos</span></div>
      <div class="footer-item" id="editToggleItem" onclick="toggleEditMode()"><span>✏️</span><span>Editar conteúdo</span></div>
      <div class="footer-item" id="resetTreeItem" style="display:none;" onclick="resetTreeConfirm()"><span>🔄</span><span>Restaurar original</span></div>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Evidência ampliada">
</div>

<script>
const GENERIC_ESCALATE_CHECKLIST = [
  'CPF do cliente',
  'Número do contrato / ID do cadastro',
  'Print ou horário exato do erro',
  'O que já foi verificado (Retool, painel QITech, Amplitude etc.)'
];

const PRAZOS = [
  { prazo:'24 horas', situacao:'Retentativa automática do sistema se a conta não conectar de primeira', categoria:'Conexão bancária' },
  { prazo:'48 horas', situacao:'Aguardar atualização no painel QITECH/Retool antes de escalar', categoria:'Score / Retool' },
  { prazo:'2 dias', situacao:'Se a conta pendente estiver parada por 2 dias ou mais, o reprocessamento automático do Senior Ops provavelmente já rodou — aguardar antes de escalar de novo', categoria:'Conta na QITECH' },
  { prazo:'10 dias', situacao:'A partir daqui, escalar conta pendente para o seniorops', categoria:'Conta na QITECH' },
  { prazo:'7 dias', situacao:'Prazo para cancelar e refazer o pedido em caso de dado incorreto', categoria:'Dados incorretos' },
  { prazo:'3 meses', situacao:'Prazo para nova tentativa após conta negada pela QITECH', categoria:'Conta na QITECH' },
];

let CATEGORIES = [
  {
    id: 'score-retool',
    title: 'Score / Retool',
    sub: 'REASON — SCORING DISABLED',
    accent: '#2B6CB0',
    root: 'q1',
    nodes: {
      q1: { type:'question', text:'Consta anotação no Retool indicando exclusão do cadastro?', options:[
        {label:'Sem anotação', next:'a_sem'},
        {label:'Com anotação', next:'q2'}
      ]},
      a_sem: { type:'action', tone:'resolve', heading:'Excluir e orientar nova tentativa', screenshot:true, steps:[
        {text:'Excluir o cadastro.', where:'Retool → CT → aba Cadastro → Excluir'},
        {text:'Pedir para o usuário tentar novamente direto pelo link da carteira de trabalho.'}
      ], clientMessage:'Explique que foi identificada uma pendência no cadastro e que ela já foi ajustada. Oriente o cliente a tentar novamente direto pelo link da Carteira de Trabalho Digital.'},
      q2: { type:'question', text:'Após conferir a data da anotação, houve atualização no painel da QITECH e no Retool?', options:[
        {label:'Sim, atualizou', next:'a_ok'},
        {label:'Não atualizou (48h ou mais)', next:'a_escalate'}
      ]},
      a_ok: { type:'action', tone:'info', heading:'Sem ação necessária', steps:[
        {text:'O cadastro está em processamento normal — não é necessário escalar.'},
        {text:'Oriente o usuário a aguardar a atualização.'}
      ], clientMessage:'Explique que o cadastro está em processamento normal e que não é necessária nenhuma ação da parte dele — assim que a atualização for concluída, ele poderá seguir com a solicitação.'},
      a_escalate: { type:'action', tone:'escalate', heading:'Escalar para Oráculos', steps:[
        {text:'Escalar o caso para o time de Oráculos.', where:'Slack → #cx-oraculos'}
      ], checklistExtra:['Data da anotação no Retool'] }
    }
  },
  {
    id: 'cancelamentos-qitech',
    title: 'Cancelamentos na QITECH',
    sub: 'Fraude e pontuação insuficiente',
    accent: '#C0392B',
    root: 'q1',
    nodes: {
      q1: { type:'question', text:'Qual o motivo do cancelamento na QITECH?', options:[
        {label:'Fraude', next:'a_fraude'},
        {label:'Pontuação insuficiente (reprovado na prova de vida)', next:'a_pontuacao'}
      ]},
      a_fraude: { type:'action', tone:'info', heading:'Pedido cancelado — Fraude', screenshot:true, steps:[
        {text:'Orientar o usuário sobre os prazos para uma nova tentativa.', where:'Painel QITech → Operações → Crédito estruturado → CPF do cliente'}
      ], clientMessage:'Informe que o pedido foi cancelado após as checagens de segurança e oriente sobre o prazo para uma nova solicitação, conforme indicado em nossos canais oficiais.'},
      a_pontuacao: { type:'action', tone:'info', heading:'Pedido cancelado — Pontuação insuficiente', steps:[
        {text:'Orientar o usuário sobre os prazos para uma nova tentativa.'}
      ], clientMessage:'Informe que o pedido não atingiu a pontuação mínima na prova de vida e oriente sobre o prazo para uma nova tentativa.'}
    }
  },
  {
    id: 'assinatura-prova-vida',
    title: 'Assinatura e Prova de Vida',
    sub: 'Erro ao assinar ou enviar prova de vida',
    accent: '#6B4FA0',
    root: 'q1',
    nodes: {
      q1: { type:'question', text:'Qual é a dificuldade relatada pelo usuário?', options:[
        {label:'Aguardando assinatura', next:'a_assinatura'},
        {label:'Não consegue enviar a prova de vida', next:'a_prova'},
        {label:'Erro ao enviar foto do documento', next:'a_documento'}

const DEFAULT_CATEGORIES = JSON.parse(JSON.stringify(CATEGORIES));

/* ============================================================
   Estado global
   ============================================================ */
let editMode = false;
let currentCatId = null;
let currentEditCatIndex = null;
let currentEditNodeId = null;
window.__evidenceKeys = new Set();
window.__evidenceCache = {};
window.__checklistExtraMap = {};

/* ============================================================
   window.storage — chave-valor compartilhado via /api/storage (Cloudflare KV)
   ============================================================ */
window.storage = {
  async get(key){
    const res = await fetch('/api/storage?key=' + encodeURIComponent(key));
    if(!res.ok) throw new Error('status ' + res.status);
    return res.json();
  },
  async set(key, value){
    const res = await fetch('/api/storage', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key, value })
    });
    if(!res.ok) throw new Error('status ' + res.status);
    return res.json();
  },
  async list(prefix){
    const res = await fetch('/api/storage?action=list&prefix=' + encodeURIComponent(prefix));
    if(!res.ok) throw new Error('status ' + res.status);
    return res.json();
  },
  async delete(key){
    const res = await fetch('/api/storage?key=' + encodeURIComponent(key), { method: 'DELETE' });
    if(!res.ok) throw new Error('status ' + res.status);
    return res.json();
  }
};

/* ============================================================
   Inicialização
   ============================================================ */
async function init(){
  try{
    const saved = await window.storage.get('tree-data', true);
    if(saved && saved.value){
      CATEGORIES = JSON.parse(saved.value);
    }
  }catch(e){ /* nada salvo ainda */ }
  renderNav();
  if(CATEGORIES.length){
    selectCategory(CATEGORIES[0].id);
  }
}

/* ============================================================
   Sidebar / navegação
   ============================================================ */
function renderNav(){
  const wrap = document.getElementById('navList');
  wrap.innerHTML = CATEGORIES.map((cat, i) => `
    <div class="nav-item ${cat.id === currentCatId ? 'active' : ''}" data-id="${cat.id}" data-title="${escapeAttr(cat.title.toLowerCase())}" onclick="selectCategory('${cat.id}')">
      <span class="dot" style="background:${cat.accent}"></span>
      <span class="label">${cat.title}</span>
      ${editMode ? `
        <div class="edit-icons">
          <button class="nav-icon-btn" title="Editar" onclick="event.stopPropagation(); openCategoryEditor(${i});">✏️</button>
          <button class="nav-icon-btn" title="Excluir" onclick="event.stopPropagation(); deleteCategoryFromNav(${i});">🗑️</button>
        </div>
      ` : ''}
    </div>
  `).join('');
  if(editMode){
    wrap.insertAdjacentHTML('beforeend', `<div class="nav-add" onclick="openCategoryEditor(null)">+ Nova categoria</div>`);
  }
}

function filterNav(q){
  q = q.trim().toLowerCase();
  const items = document.querySelectorAll('.nav-item');
  let visible = 0;
  items.forEach(el => {
    const match = el.dataset.title.includes(q);
    el.style.display = match ? 'flex' : 'none';
    if(match) visible++;
  });
  document.getElementById('noCatResults').style.display = visible === 0 ? 'block' : 'none';
}

function toggleEditMode(){
  editMode = !editMode;
  const item = document.getElementById('editToggleItem');
  item.classList.toggle('edit-active', editMode);
  item.innerHTML = editMode ? '<span>👁️</span><span>Sair do modo de edição</span>' : '<span>✏️</span><span>Editar conteúdo</span>';
  document.getElementById('resetTreeItem').style.display = editMode ? 'flex' : 'none';
  renderNav();
  if(currentCatId){ selectCategory(currentCatId); }
}

/* ============================================================
   Visualização da categoria (árvore em acordeão)
   ============================================================ */
async function selectCategory(catId){
  currentCatId = catId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.id === catId));
  const cat = CATEGORIES.find(c => c.id === catId);
  if(!cat){ document.getElementById('main').innerHTML = '<p class="empty-state">Categoria não encontrada.</p>'; return; }

  let evidenceKeys = new Set();
  try{
    const res = await window.storage.list('img:' + catId + '__', true);
    if(res && res.keys) evidenceKeys = new Set(res.keys);
  }catch(e){ /* sem imagens ainda */ }
  window.__evidenceKeys = evidenceKeys;
  window.__checklistExtraMap = {};

  const editBtn = editMode ? `
    <div class="header-actions">
      <button class="header-btn" onclick="openCategoryEditor(${CATEGORIES.indexOf(cat)})">✏️ Editar esta categoria</button>
    </div>
  ` : '';

  const treeHtml = cat.root ? renderNodeGraph(cat, cat.root, 0) : '<p class="empty-state">Nenhuma etapa criada ainda nesta categoria.</p>';

  document.getElementById('main').innerHTML = `
    <div class="main-header">
      <h2>${cat.title}</h2>
      <p class="sub-main">${cat.sub}</p>
      ${editBtn}
    </div>
    <div id="treeWrap">${treeHtml}</div>
  `;
  bindEvidenceToggles(document.getElementById('treeWrap'));
}

function renderStepsListHtml(steps){
  return `<ul class="steps-list">${steps.map((s,i) => `
    <li>
      <span class="badge">${i+1}</span>
      <span class="txt">${typeof s === 'string' ? s : s.text}${(s.where) ? `<br><span class="where">📍 ${s.where}</span>` : ''}</span>
    </li>
  `).join('')}</ul>`;
}

function renderEvidenceWidget(catId, nodeId){
  const key = `img:${catId}__${nodeId}`;
  const has = window.__evidenceKeys && window.__evidenceKeys.has(key);
  return `
    <details class="evidence" data-key="${key}">
      <summary>📎 ${has ? 'Ver print de referência 📷' : 'Anexar print de referência'}</summary>
      <div class="evidence-body" data-role="body"></div>
    </details>
  `;
}

function renderEscalateBtn(nodeKey, extra){
  window.__checklistExtraMap[nodeKey] = extra || [];
  return `<button class="escalate-checklist-btn" onclick="openChecklist('${nodeKey}')">✅ Checklist antes de escalar</button>`;
}

function renderNodeGraph(cat, nodeId, depth){
  if(depth > 40) return '<p class="empty-state">⚠️ Profundidade máxima atingida — verifique se há um ciclo nas etapas.</p>';
  const node = cat.nodes[nodeId];
  if(!node) return `<p class="empty-state">⚠️ Etapa "${escapeAttr(nodeId)}" não encontrada.</p>`;

  if(node.type === 'question'){
    const answerId = 'qa_' + Math.random().toString(36).slice(2, 10);
    return `
      <div class="question-block">
        <p class="q-text">${node.text}</p>
        <div class="choice-buttons">
          ${node.options.map(o => `
            <button type="button" class="option-btn" onclick="selectOption('${cat.id}','${answerId}','${o.next}', this)">
              <span>${o.label}</span><span class="arrow">→</span>
            </button>
          `).join('')}
        </div>
        <div class="choice-answer" id="${answerId}"></div>
      </div>
    `;
  }

  if(node.type === 'steps'){
    return `
      <div class="steps-block">
        <h4>${node.heading}</h4>
        ${renderStepsListHtml(node.steps)}
        ${renderEvidenceWidget(cat.id, nodeId)}
      </div>
      ${renderNodeGraph(cat, node.next, depth+1)}
    `;
  }

  if(node.type === 'action'){
    const toneLabel = {resolve:'Ação', escalate:'Escalar', info:'Orientar'}[node.tone] || 'Ação';
    const nodeKey = `${cat.id}__${nodeId}`;
    return `
      <div class="leaf ${node.tone}">
        <span class="tone-tag">${toneLabel}</span>
        <h4>${node.heading}</h4>
        ${renderStepsListHtml(node.steps)}
        ${node.assumption ? `<div class="assumption">⚠️ ${node.assumption}</div>` : ''}
        ${node.clientMessage ? `
          <div class="client-msg">
            <div class="label"><span>💬 Instrução para o cliente</span></div>
            <p>${node.clientMessage}</p>
          </div>
        ` : ''}
        ${renderEvidenceWidget(cat.id, nodeId)}
        ${node.tone === 'escalate' ? renderEscalateBtn(nodeKey, node.checklistExtra) : ''}
      </div>
    `;
  }
  return '';
}

function selectOption(catId, answerId, nextNodeId, btnEl){
  const cat = CATEGORIES.find(c => c.id === catId);
  const container = document.getElementById(answerId);
  if(!cat || !container) return;
  container.innerHTML = renderNodeGraph(cat, nextNodeId, 0);
  const group = btnEl.closest('.choice-buttons');
  if(group) group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  bindEvidenceToggles(container);
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ============================================================
   Evidência (print/foto de referência)
   ============================================================ */
function bindEvidenceToggles(container){
  container.querySelectorAll('details.evidence').forEach(d => {
    d.addEventListener('toggle', () => {
      if(d.open && !d.dataset.loaded){
        loadEvidence(d);
      }
    });
  });
}

function loadEvidence(details){
  const key = details.dataset.key;
  const bodyEl = details.querySelector('[data-role="body"]');
  details.dataset.loaded = '1';

  if(window.__evidenceCache[key]){
    renderEvidenceLoaded(bodyEl, key, window.__evidenceCache[key]);
    return;
  }
  if(window.__evidenceKeys && window.__evidenceKeys.has(key)){
    bodyEl.innerHTML = '<p class="evidence-loading">Carregando…</p>';
    window.storage.get(key, true).then(res => {
      if(res && res.value){
        window.__evidenceCache[key] = res.value;
        renderEvidenceLoaded(bodyEl, key, res.value);
      } else {
        renderEvidenceDropzone(bodyEl, key);
      }
    }).catch(() => renderEvidenceDropzone(bodyEl, key));
  } else {
    renderEvidenceDropzone(bodyEl, key);
  }
}

function renderEvidenceDropzone(bodyEl, key){
  bodyEl.innerHTML = `
    <label class="evidence-dropzone">
      📎 Clique para anexar um print, ou arraste uma imagem aqui
      <input type="file" accept="image/*" onchange="onEvidenceFileChange(event, '${key}')">
    </label>
  `;
  const dz = bodyEl.querySelector('.evidence-dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.background = 'var(--hover-bg)'; });
  dz.addEventListener('dragleave', () => { dz.style.background = ''; });
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.style.background = '';
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) handleEvidenceFile(file, key, bodyEl);
  });
}

function renderEvidenceLoaded(bodyEl, key, dataUrl){
  bodyEl.innerHTML = `
    <div class="evidence-thumb-wrap">
      <img class="evidence-thumb" src="${dataUrl}" onclick="openLightbox('${key}')" alt="Print de referência">
      <div class="evidence-thumb-actions">
        <label class="evidence-small-btn" style="text-align:center;">
          Substituir
          <input type="file" accept="image/*" style="display:none" onchange="onEvidenceFileChange(event, '${key}')">
        </label>
        <button class="evidence-small-btn danger" onclick="removeEvidence('${key}', this)">Remover</button>
      </div>
    </div>
  `;
}

function onEvidenceFileChange(event, key){
  const file = event.target.files && event.target.files[0];
  const bodyEl = event.target.closest('.evidence-body');
  if(file) handleEvidenceFile(file, key, bodyEl);
}

function compressImage(dataUrl, maxWidth, quality){
  maxWidth = maxWidth || 900;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function handleEvidenceFile(file, key, bodyEl){
  if(!file || !file.type.startsWith('image/')){
    bodyEl.innerHTML = '<p class="evidence-loading">Arquivo inválido — envie uma imagem.</p>';
    return;
  }
  bodyEl.innerHTML = '<p class="evidence-loading">Processando imagem…</p>';
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const compressed = await compressImage(e.target.result);
      await window.storage.set(key, compressed, true);
      window.__evidenceCache[key] = compressed;
      window.__evidenceKeys.add(key);
      renderEvidenceLoaded(bodyEl, key, compressed);
    }catch(err){
      console.error(err);
      bodyEl.innerHTML = '<p class="evidence-loading">Não foi possível salvar a imagem. Tente um arquivo menor.</p>';
    }
  };
  reader.readAsDataURL(file);
}

async function removeEvidence(key, btn){
  if(!confirm('Remover este print de referência?')) return;
  try{ await window.storage.delete(key, true); }catch(e){}
  delete window.__evidenceCache[key];
  window.__evidenceKeys.delete(key);
  const bodyEl = btn.closest('.evidence-body');
  renderEvidenceDropzone(bodyEl, key);
}

function openLightbox(key){
  const url = window.__evidenceCache[key];
  if(!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
}

/* ============================================================
   Prazos / Checklist
   ============================================================ */
function backToCategory(){
  if(currentCatId){ selectCategory(currentCatId); }
  else if(CATEGORIES.length){ selectCategory(CATEGORIES[0].id); }
}

function openPrazos(){
  document.getElementById('main').innerHTML = `
    <button class="back-link" onclick="backToCategory()">← Voltar</button>
    <div class="main-header"><h2>Tabela de prazos</h2></div>
    <table class="prazos-table">
      <thead><tr><th>Prazo</th><th>Situação</th><th>Categoria</th></tr></thead>
      <tbody>
        ${PRAZOS.map(p => `<tr><td><strong>${p.prazo}</strong></td><td>${p.situacao}</td><td class="categoria">${p.categoria}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

function openChecklist(nodeKey){
  const extra = window.__checklistExtraMap[nodeKey] || [];
  document.getElementById('main').innerHTML = `
    <button class="back-link" onclick="backToCategory()">← Voltar</button>
    <div class="main-header"><h2>Antes de escalar</h2><p class="sub-main">Confirme que já tem isso em mãos antes de abrir o chamado.</p></div>
    <div class="checklist-box">
      <ul>
        ${GENERIC_ESCALATE_CHECKLIST.map(item => `<li><input type="checkbox"><span>${item}</span></li>`).join('')}
      </ul>
      ${extra.length ? `
        <p style="font-size:12.5px; color:var(--ink-soft); margin:16px 0 8px;">Específico deste caso:</p>
        <ul>${extra.map(item => `<li><input type="checkbox"><span>${item}</span></li>`).join('')}</ul>
      ` : ''}
    </div>
  `;
}

/* ============================================================
   Editor de conteúdo — categorias e etapas
   ============================================================ */
function genId(prefix, textForSlug){
  const base = (textForSlug || prefix)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 24) || prefix;
  return base + '_' + Math.random().toString(36).slice(2, 6);
}

function nodeLabel(node){
  if(!node) return '(etapa não encontrada)';
  if(node.type === 'question') return '❓ ' + node.text;
  if(node.type === 'steps') return '📋 ' + node.heading;
  if(node.type === 'action') return '✅ ' + node.heading;
  return '(sem título)';
}

async function persistTree(){
  try{
    await window.storage.set('tree-data', JSON.stringify(CATEGORIES), true);
  }catch(e){
    console.error('Não foi possível salvar as alterações', e);
    alert('Não foi possível salvar as alterações agora. Tente novamente em instantes.');
  }
}

function deleteCategoryFromNav(catIndex){
  if(!confirm(`Excluir a categoria "${CATEGORIES[catIndex].title}"? Isso remove todas as etapas dela.`)) return;
  const wasCurrent = CATEGORIES[catIndex].id === currentCatId;
  CATEGORIES.splice(catIndex, 1);
  persistTree();
  renderNav();
  if(wasCurrent && CATEGORIES.length){ selectCategory(CATEGORIES[0].id); }
  else if(CATEGORIES.length === 0){ document.getElementById('main').innerHTML = '<p class="empty-state">Nenhuma categoria ainda. Use "+ Nova categoria" na barra lateral.</p>'; }
}

async function resetTreeConfirm(){
  if(!confirm('Isso vai apagar todas as edições feitas por qualquer pessoa e voltar para a versão original da árvore. Continuar?')) return;
  CATEGORIES = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  await persistTree();
  renderNav();
  if(CATEGORIES.length) selectCategory(CATEGORIES[0].id);
}

function openCategoryEditor(catIndex){
  const isNew = catIndex === null;
  if(isNew){
    CATEGORIES.push({ id: genId('cat'), title:'', sub:'', accent:'#5B5BD6', root:null, nodes:{} });
    catIndex = CATEGORIES.length - 1;
  }
  currentEditCatIndex = catIndex;
  const cat = CATEGORIES[catIndex];
  currentCatId = cat.id;

  document.getElementById('main').innerHTML = `
    <button class="back-link" onclick="backToCategory()">← Voltar</button>
    <div class="main-header"><h2>${isNew ? 'Nova categoria' : 'Editar categoria'}</h2></div>
    <div class="steps-block">
      <div class="form-group"><label>Título da categoria</label><input type="text" id="catTitleInput" value="${escapeAttr(cat.title)}" placeholder="Ex: Conexão bancária e Pix Inteligente"></div>
      <div class="form-group"><label>Subtítulo (aparece abaixo do título)</label><input type="text" id="catSubInput" value="${escapeAttr(cat.sub)}" placeholder="Ex: Falha ao conectar conta ou autorizar Pix"></div>
      <div class="form-group"><label>Cor de destaque</label><input type="color" id="catAccentInput" value="${cat.accent || '#5B5BD6'}"></div>
      <div class="form-group"><label>Etapa inicial (por onde o fluxo desta categoria começa)</label><select id="catRootInput"></select></div>
      <button class="continue-btn" onclick="saveCategoryBasic()">💾 Salvar categoria</button>
    </div>

    <h3 style="font-size:14px; margin:22px 0 10px;">Etapas desta categoria</h3>
    <div class="editor-hint">Cada etapa é uma pergunta, uma sequência de passos ou uma ação final. Crie a etapa aqui primeiro; depois volte na etapa anterior (pergunta ou passos) para conectá-la como destino.</div>
    <div id="nodeListWrap"></div>
    <button class="add-row-btn" onclick="openNodeEditor(null)">+ Nova etapa</button>

    <div class="footer-actions">
      <button class="restart-btn" onclick="deleteCategoryConfirm()">🗑️ Excluir categoria inteira</button>
    </div>
  `;
  renderRootSelect();
  renderNodeList();
}

function renderRootSelect(){
  const cat = CATEGORIES[currentEditCatIndex];
  const sel = document.getElementById('catRootInput');
  const nodeIds = Object.keys(cat.nodes);
  if(nodeIds.length === 0){
    sel.innerHTML = '<option value="">— crie uma etapa primeiro —</option>';
    return;
  }
  sel.innerHTML = nodeIds.map(id => `<option value="${id}" ${cat.root === id ? 'selected' : ''}>${escapeAttr(nodeLabel(cat.nodes[id]))}</option>`).join('');
}

function saveCategoryBasic(){
  const cat = CATEGORIES[currentEditCatIndex];
  cat.title = document.getElementById('catTitleInput').value.trim() || 'Categoria sem título';
  cat.sub = document.getElementById('catSubInput').value.trim();
  cat.accent = document.getElementById('catAccentInput').value;
  cat.root = document.getElementById('catRootInput').value || cat.root;
  currentCatId = cat.id;
  persistTree();
  renderNav();
  selectCategory(cat.id);
}

function deleteCategoryConfirm(){
  if(currentEditCatIndex === null) return;
  if(!confirm(`Excluir a categoria "${CATEGORIES[currentEditCatIndex].title}"? Isso remove todas as etapas dela.`)) return;
  CATEGORIES.splice(currentEditCatIndex, 1);
  persistTree();
  renderNav();
  if(CATEGORIES.length){ selectCategory(CATEGORIES[0].id); }
  else{ document.getElementById('main').innerHTML = '<p class="empty-state">Nenhuma categoria ainda.</p>'; }
}

function renderNodeList(){
  const cat = CATEGORIES[currentEditCatIndex];
  const wrap = document.getElementById('nodeListWrap');
  const nodeIds = Object.keys(cat.nodes);
  if(nodeIds.length === 0){
    wrap.innerHTML = '<p class="empty-state">Nenhuma etapa criada ainda.</p>';
    return;
  }
  wrap.innerHTML = nodeIds.map(id => {
    const node = cat.nodes[id];
    const typeTag = {question:'Pergunta', steps:'Passos', action:'Ação'}[node.type] || node.type;
    return `
      <div class="node-list-item">
        <div class="info">
          <div class="type-tag">${typeTag}${id === cat.root ? '<span class="root-tag">Etapa inicial</span>' : ''}</div>
          <div class="preview">${nodeLabel(node)}</div>
        </div>
        <div class="node-list-actions">
          <button class="icon-btn" title="Editar etapa" onclick="openNodeEditor('${id}')">✏️</button>
          <button class="icon-btn danger" title="Excluir etapa" onclick="deleteNodeFromList('${id}')">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

function deleteNodeFromList(nodeId){
  const cat = CATEGORIES[currentEditCatIndex];
  if(nodeId === cat.root){
    alert('Esta é a etapa inicial da categoria. Defina outra etapa como inicial antes de excluir esta.');
    return;
  }
  if(!confirm('Excluir esta etapa? Verifique depois se alguma pergunta ainda aponta para ela.')) return;
  delete cat.nodes[nodeId];
  persistTree();
  renderNodeList();
  renderRootSelect();
}

function backToCategoryEditor(){
  openCategoryEditor(currentEditCatIndex);
}

function openNodeEditor(nodeId){
  currentEditNodeId = nodeId;
  const cat = CATEGORIES[currentEditCatIndex];
  const node = nodeId ? cat.nodes[nodeId] : { type:'question', text:'', options:[] };

  document.getElementById('main').innerHTML = `
    <button class="back-link" onclick="backToCategoryEditor()">← Voltar à categoria</button>
    <div class="main-header"><h2>${nodeId ? 'Editar etapa' : 'Nova etapa'}</h2></div>
    <div class="steps-block">
      <div class="form-group">
        <label>Tipo de etapa</label>
        <select id="nodeTypeInput" onchange="renderNodeEditorFields()">
          <option value="question">Pergunta (ramifica em opções)</option>
          <option value="steps">Passos (sequência, sem decisão)</option>
          <option value="action">Ação final (resolve, orienta ou escala)</option>
        </select>
      </div>
      <div id="nodeEditorFields"></div>
      <div class="footer-actions">
        <button class="continue-btn" onclick="saveNode()">💾 Salvar etapa</button>
        ${nodeId ? `<button class="restart-btn" onclick="deleteNodeConfirm()">🗑️ Excluir etapa</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('nodeTypeInput').value = node.type;
  renderNodeEditorFields(node);
}

function otherNodeOptionsHtml(selectedId){
  const cat = CATEGORIES[currentEditCatIndex];
  const ids = Object.keys(cat.nodes).filter(id => id !== currentEditNodeId);
  const opts = ids.map(id => `<option value="${id}" ${id === selectedId ? 'selected' : ''}>${escapeAttr(nodeLabel(cat.nodes[id]))}</option>`).join('');
  return `<option value="">— selecione uma etapa já criada —</option>` + opts;
}

function renderNodeEditorFields(existingNode){
  const type = document.getElementById('nodeTypeInput').value;
  const node = existingNode || {};
  const fields = document.getElementById('nodeEditorFields');

  if(type === 'question'){
    const options = node.options || [{label:'', next:''}];
    fields.innerHTML = `
      <div class="editor-hint">Não achou a etapa de destino na lista? Volte, crie-a em "+ Nova etapa" e depois conecte aqui.</div>
      <div class="form-group"><label>Texto da pergunta</label><textarea id="f_text">${node.text || ''}</textarea></div>
      <div class="form-group">
        <label>Opções de resposta</label>
        <div class="form-row-list" id="optionsList">
          ${options.map((o,i) => optionRowHtml(o, i)).join('')}
        </div>
        <button type="button" class="add-row-btn" onclick="addOptionRow()">+ Adicionar opção</button>
      </div>
    `;
  }

  else if(type === 'steps'){
    const steps = node.steps || [{text:'', where:''}];
    fields.innerHTML = `
      <div class="form-group"><label>Título do bloco de passos</label><input type="text" id="f_heading" value="${escapeAttr(node.heading || '')}"></div>
      <div class="form-group">
        <label>Passos</label>
        <div class="form-row-list" id="stepsList">
          ${steps.map((s,i) => stepRowHtml(s, i)).join('')}
        </div>
        <button type="button" class="add-row-btn" onclick="addStepRow('stepsList')">+ Adicionar passo</button>
      </div>
      <div class="form-group"><label>Próxima etapa (depois destes passos)</label><select id="f_next">${otherNodeOptionsHtml(node.next)}</select></div>
    `;
  }

  else if(type === 'action'){
    const steps = node.steps || [{text:'', where:''}];
    const checklistExtra = node.checklistExtra || [];
    fields.innerHTML = `
      <div class="form-group"><label>Título da ação</label><input type="text" id="f_heading" value="${escapeAttr(node.heading || '')}"></div>
      <div class="form-group">
        <label>Tom</label>
        <select id="f_tone" onchange="toggleChecklistExtraVisibility()">
          <option value="resolve" ${node.tone==='resolve'?'selected':''}>Resolver (verde)</option>
          <option value="escalate" ${node.tone==='escalate'?'selected':''}>Escalar (laranja)</option>
          <option value="info" ${(!node.tone || node.tone==='info')?'selected':''}>Orientar (azul)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Passos / instruções</label>
        <div class="form-row-list" id="actionStepsList">
          ${steps.map((s,i) => stepRowHtml(s, i)).join('')}
        </div>
        <button type="button" class="add-row-btn" onclick="addStepRow('actionStepsList')">+ Adicionar passo</button>
      </div>
      <div class="form-group"><label>Ressalva / observação (opcional)</label><textarea id="f_assumption">${node.assumption || ''}</textarea></div>
      <div class="form-group"><label>Instrução para o cliente (opcional)</label><textarea id="f_clientMessage" placeholder="Escreva como orientação para o atendente falar com as próprias palavras — não como script pronto para copiar.">${node.clientMessage || ''}</textarea></div>
      <div class="editor-hint">📎 O espaço para anexar um print de referência aparece automaticamente para quem usar esta etapa — não precisa configurar nada aqui.</div>
      <div id="checklistExtraWrapEditor" style="display:${node.tone==='escalate' ? 'block':'none'};">
        <div class="form-group">
          <label>Itens específicos para o checklist "antes de escalar" (opcional)</label>
          <div class="form-row-list" id="checklistExtraList">
            ${(checklistExtra.length ? checklistExtra : ['']).map((c,i) => checklistExtraRowHtml(c, i)).join('')}
          </div>
          <button type="button" class="add-row-btn" onclick="addChecklistExtraRow()">+ Adicionar item</button>
        </div>
      </div>
    `;
  }
}

function toggleChecklistExtraVisibility(){
  const tone = document.getElementById('f_tone').value;
  const wrap = document.getElementById('checklistExtraWrapEditor');
  if(wrap) wrap.style.display = tone === 'escalate' ? 'block' : 'none';
}

function optionRowHtml(o, i){
  return `
    <div class="form-row-item" data-idx="${i}">
      <div class="fields">
        <input type="text" placeholder="Texto da opção (ex: Sem anotação)" value="${escapeAttr(o.label || '')}" data-field="label">
        <select data-field="next">${otherNodeOptionsHtml(o.next)}</select>
      </div>
      <button type="button" class="row-remove-btn" onclick="this.closest('.form-row-item').remove()">✕</button>
    </div>
  `;
}
function addOptionRow(){
  document.getElementById('optionsList').insertAdjacentHTML('beforeend', optionRowHtml({label:'',next:''}, Date.now()));
}

function stepRowHtml(s, i){
  const text = typeof s === 'string' ? s : (s.text || '');
  const where = typeof s === 'string' ? '' : (s.where || '');
  return `
    <div class="form-row-item" data-idx="${i}">
      <div class="fields">
        <input type="text" placeholder="O que fazer neste passo" value="${escapeAttr(text)}" data-field="text">
        <input type="text" placeholder="Onde encontrar (opcional, ex: Retool → CT → aba Cadastro)" value="${escapeAttr(where)}" data-field="where">
      </div>
      <button type="button" class="row-remove-btn" onclick="this.closest('.form-row-item').remove()">✕</button>
    </div>
  `;
}
function addStepRow(listId){
  document.getElementById(listId).insertAdjacentHTML('beforeend', stepRowHtml({text:'',where:''}, Date.now()));
}

function checklistExtraRowHtml(text, i){
  return `
    <div class="form-row-item" data-idx="${i}">
      <div class="fields">
        <input type="text" placeholder="Ex: Print exato da mensagem de erro" value="${escapeAttr(text || '')}" data-field="text">
      </div>
      <button type="button" class="row-remove-btn" onclick="this.closest('.form-row-item').remove()">✕</button>
    </div>
  `;
}
function addChecklistExtraRow(){
  document.getElementById('checklistExtraList').insertAdjacentHTML('beforeend', checklistExtraRowHtml('', Date.now()));
}

function readRows(containerId, fieldNames){
  const container = document.getElementById(containerId);
  if(!container) return [];
  return Array.from(container.querySelectorAll('.form-row-item')).map(row => {
    const obj = {};
    fieldNames.forEach(f => {
      const el = row.querySelector(`[data-field="${f}"]`);
      obj[f] = el ? el.value.trim() : '';
    });
    return obj;
  });
}

function saveNode(){
  const cat = CATEGORIES[currentEditCatIndex];
  const type = document.getElementById('nodeTypeInput').value;
  let node;

  if(type === 'question'){
    const text = document.getElementById('f_text').value.trim();
    const options = readRows('optionsList', ['label','next']).filter(o => o.label && o.next);
    if(!text || options.length === 0){
      alert('Preencha o texto da pergunta e conecte ao menos uma opção a uma etapa existente.');
      return;
    }
    node = { type:'question', text, options };
  }

  else if(type === 'steps'){
    const heading = document.getElementById('f_heading').value.trim();
    const steps = readRows('stepsList', ['text','where']).filter(s => s.text).map(s => s.where ? s : {text:s.text});
    const next = document.getElementById('f_next').value;
    if(!heading || steps.length === 0 || !next){
      alert('Preencha o título, ao menos um passo, e selecione a próxima etapa.');
      return;
    }
    node = { type:'steps', heading, steps, next };
  }

  else if(type === 'action'){
    const heading = document.getElementById('f_heading').value.trim();
    const tone = document.getElementById('f_tone').value;
    const steps = readRows('actionStepsList', ['text','where']).filter(s => s.text).map(s => s.where ? s : {text:s.text});
    const assumption = document.getElementById('f_assumption').value.trim();
    const clientMessage = document.getElementById('f_clientMessage').value.trim();
    if(!heading || steps.length === 0){
      alert('Preencha o título da ação e ao menos um passo.');
      return;
    }
    node = { type:'action', tone, heading, steps };
    if(assumption) node.assumption = assumption;
    if(clientMessage) node.clientMessage = clientMessage;
    if(tone === 'escalate'){
      const extra = readRows('checklistExtraList', ['text']).map(r => r.text).filter(Boolean);
      if(extra.length) node.checklistExtra = extra;
    }
  }

  const id = currentEditNodeId || genId(type, node.text || node.heading);
  cat.nodes[id] = node;
  if(!cat.root) cat.root = id;
  currentEditNodeId = id;
  persistTree();
  backToCategoryEditor();
}

function deleteNodeConfirm(){
  if(!currentEditNodeId) return;
  const cat = CATEGORIES[currentEditCatIndex];
  if(currentEditNodeId === cat.root){
    alert('Esta é a etapa inicial da categoria. Defina outra etapa como inicial antes de excluir esta.');
    return;
  }
  if(!confirm('Excluir esta etapa? Verifique depois se alguma pergunta ainda aponta para ela.')) return;
  delete cat.nodes[currentEditNodeId];
  persistTree();
  backToCategoryEditor();
}

init();
</script>
